<!DOCTYPE html>
<!-- Reel cover images (1080x1920, 9:16), one per script in REELS.md. Covers are generated from the REELS list below.
     The profile grid crops covers to the centre 1080x1440, so everything important sits between y=240 and y=1680.
     Rendered to tools/instagram/out/<id>.png by render_posts.mjs. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anqah Tech Reel covers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Fraunces:ital,opsz,wght@1,9..144,600&family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #333; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }
.post { position: relative; width: 1080px; height: 1920px; overflow: hidden; flex: none; background: var(--bg); color: var(--fg); font-family: 'Inter', sans-serif; }
.post::before { content: ''; position: absolute; inset: 0; background: var(--tex, none); }
.brand { position: absolute; top: 260px; left: 80px; right: 80px; display: flex; align-items: center; gap: 16px; font: 700 30px 'Space Grotesk'; letter-spacing: 0.08em; z-index: 3; }
.brand img { height: 50px; }
.brand .no { margin-left: auto; font: 700 26px 'JetBrains Mono'; padding: 10px 18px; border: 3px solid var(--accent); color: var(--accent); letter-spacing: 0.06em; }
.body { position: absolute; left: 80px; right: 80px; top: 380px; z-index: 3; }
.hook { font: 700 30px 'JetBrains Mono'; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; }
h1 { font-family: var(--font, 'Archivo Black'); font-weight: 400; font-size: var(--size, 112px); line-height: 1.05; letter-spacing: -0.02em; margin-top: 22px; }
h1 em { font-style: normal; color: var(--accent); }
.ar { font: 900 64px/1.35 'Cairo'; direction: rtl; text-align: right; margin-top: 26px; opacity: 0.92; }
.media { position: absolute; left: 80px; right: 80px; z-index: 2; top: var(--mtop, 1010px); height: 640px; }
.media .card { width: 100%; height: 100%; border-radius: 28px; overflow: hidden; border: 4px solid var(--fg); box-shadow: 0 30px 70px rgba(0,0,0,0.35); }
.media .card img { width: 100%; height: 100%; object-fit: cover; }
.media .phone { position: absolute; width: 300px; border: 12px solid #15171a; border-radius: 46px; overflow: hidden; background: #000; box-shadow: 0 30px 70px rgba(0,0,0,0.45); }
.media .phone img { display: block; width: 100%; }
.play { position: absolute; z-index: 4; width: 150px; height: 150px; border-radius: 50%; background: var(--accent); color: var(--accent-ink, #000); display: grid; place-items: center; font-size: 60px; right: 40px; top: -60px; box-shadow: 0 12px 40px rgba(0,0,0,0.35); padding-left: 10px; }
.foot { position: absolute; left: 80px; right: 80px; top: 1700px; display: flex; justify-content: space-between; font: 700 26px 'JetBrains Mono'; opacity: 0.8; z-index: 3; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: 100%; }
.split > div { position: relative; border-radius: 24px; overflow: hidden; border: 4px solid var(--fg); }
.split img { width: 100%; height: 100%; object-fit: cover; }
.split span { position: absolute; left: 16px; top: 16px; font: 800 28px 'Inter'; background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 10px; }
</style>
</head>
<body>
<script>
const W = '../../images/logo-mark-white.png', N = '../../images/logo-mark-navy.png', I = '../../images/';
const card = src => `<div class="card"><img src="${I}${src}" alt=""></div>`;
const phones = (a, b) => `<div class="phone" style="left:60px; top:-20px; transform:rotate(-7deg)"><img src="${I}${a}" alt=""></div>` +
                         (b ? `<div class="phone" style="left:420px; top:-60px; transform:rotate(5deg)"><img src="${I}${b}" alt=""></div>` : '');
const split = (a, la, b, lb, fa = '', fb = '') =>
    `<div class="split"><div><img src="${I}${a}" alt="" style="${fa}"><span>${la}</span></div><div><img src="${I}${b}" alt="" style="${fb}"><span>${lb}</span></div></div>`;

// id, theme vars, logo, hook, title (html), arabic, media html, footer label
const REELS = [
  ['reel-01-bill-in-5-seconds', '--bg:#07080a;--fg:#e9edf0;--accent:#b6ff3b;--tex:radial-gradient(circle,#2a3138 1.4px,transparent 2px) 0 0/36px 36px', W,
   'SELLO POS · speed test', 'A bill in <em>5 seconds</em> ⏱️', 'فاتورة في 5 ثوانٍ', card('products/sello/sello-pos-device.webp'), 'POS'],
  ['reel-02-roof-vs-phone', '--bg:#0a3a8c;--fg:#fff;--accent:#ffd23f;--accent-ink:#0a3a8c;--tex:linear-gradient(rgba(255,255,255,.12) 2px,transparent 2px) 0 0/120px 120px,linear-gradient(90deg,rgba(255,255,255,.12) 2px,transparent 2px) 0 0/120px 120px', W,
   'Water Monitor', 'Roof check <em>vs.</em> phone check 🥵', 'السطح أم الجوال؟', card('profile/stage-water-monitoring.jpg'), 'WATER'],
  ['reel-03-pov-closing-time', '--bg:#1b0d0a;--fg:#fff3ee;--accent:#ff6b3d;--tex:radial-gradient(900px 700px at 80% 20%,rgba(255,107,61,.25),transparent 60%)', W,
   'POV', '11 pm. The cash <em>doesn\'t match</em> 😩', 'الساعة 11 والنقد لا يطابق', card('products/pos-hardware/drawer.jpg'), 'POS'],
  ['reel-04-offline-still-selling', '--bg:#0c2626;--fg:#eafffb;--accent:#2dd4bf;--tex:radial-gradient(800px 700px at 20% 80%,rgba(45,212,191,.22),transparent 60%)', W,
   'SELLO Lite · offline', 'Internet\'s down… <em>still selling</em> 😎', 'انقطع الإنترنت… والبيع مستمر', phones('products/sello-lite/sello-lite-sell.webp', 'products/sello-lite/sello-lite-payments.webp'), 'LITE'],
  ['reel-05-bell-rings-itself', '--bg:#101826;--fg:#eef2f8;--accent:#7fb3ff;--tex:radial-gradient(900px 800px at 85% 75%,rgba(127,179,255,.22),transparent 60%)', W,
   'Automatic Bell', 'The bell that <em>rings itself</em> 🔔', 'الجرس الذي يرنّ وحده', card('products/automatic-bell/bell-system-steel.webp'), 'BELL'],
  ['reel-06-unboxing-pos-counter', '--bg:#d4b07a;--fg:#2a1d0e;--accent:#2a1d0e;--accent-ink:#d4b07a;--tex:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 3px,transparent 3px 9px)', N,
   'Unboxing', 'A full POS counter <em>in one box</em> 📦', 'تجهيزات الكاشير كاملة', split('products/pos-hardware/terminal.jpg', 'Terminal', 'products/pos-hardware/printer.jpg', 'Printer'), 'POS'],
  ['reel-07-website-glow-up', '--bg:#f3efe6;--fg:#15171a;--accent:#ff5a36;--accent-ink:#fff;--font:Fraunces;--size:120px', N,
   'Website glow-up', '2015 <em>vs.</em> 2026 ✨', 'موقعك قبل وبعد', `<div class="card"><img src="img/anqah-desktop.jpg" alt="" style="object-position:50% 0"></div>`, 'WEB'],
  ['reel-08-day-vs-night-cctv', '--bg:#060606;--fg:#f2f2f2;--accent:#ff3b3b;--accent-ink:#fff;--font:Anton;--size:150px;--tex:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 5px)', W,
   '● REC · CCTV', 'DAY <em>VS.</em> NIGHT', 'الكاميرا نهارًا وليلًا 🌙',
   split('products/pos-hardware/terminal.jpg', 'DAY', 'products/pos-hardware/terminal.jpg', 'NIGHT', 'filter:grayscale(1) contrast(1.2)', 'filter:grayscale(1) brightness(.55) contrast(1.4) sepia(.4) hue-rotate(70deg)'), 'CCTV'],
  ['reel-09-idea-to-app', '--bg:#b6ff3b;--fg:#0a0d05;--accent:#0a0d05;--accent-ink:#b6ff3b', N,
   'Mobile apps', 'Idea → App <em>in 4 steps</em> 📱', 'من الفكرة إلى التطبيق', phones('products/sello-lite/sello-lite-report.webp', 'products/automatic-bell/bell-app-home.webp'), 'APP'],
  ['reel-10-ai-replies-at-2am', '--bg:#0b0618;--fg:#fff;--accent:#f0abfc;--tex:radial-gradient(700px 600px at 15% 30%,#7c3aed,transparent 60%),radial-gradient(700px 700px at 95% 60%,#2563eb,transparent 60%),radial-gradient(800px 600px at 30% 100%,#db2777,transparent 60%)', W,
   '✦ AI solutions', 'AI replies <em>at 2 am</em> 🤖', 'الذكاء الاصطناعي يرد الساعة 2 فجرًا',
   `<div class="card" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4);padding:50px;display:grid;gap:26px;align-content:center;font:500 36px/1.4 Inter">
      <div style="justify-self:end;background:#fff;color:#1e1b4b;padding:24px 30px;border-radius:30px 30px 6px 30px;max-width:80%">Are you open for orders now? 🌙</div>
      <div style="justify-self:start;background:linear-gradient(135deg,#7c3aed,#2563eb);padding:24px 30px;border-radius:30px 30px 30px 6px;max-width:85%"><small style="display:block;font-size:24px;opacity:.75">✦ AI assistant · 2s</small>Yes! I can take your order right now 🙌</div>
      <div style="justify-self:end;font:700 30px 'JetBrains Mono';opacity:.8">02:07 AM</div></div>`, 'AI'],
  ['reel-11-one-team-install', '--bg:#ffcc00;--fg:#111;--accent:#111;--accent-ink:#ffcc00;--font:Anton;--size:130px;--tex:repeating-linear-gradient(-45deg,#111 0 34px,transparent 34px 68px) 0 0/100% 46px no-repeat', N,
   'Engineering', '5 CONTRACTORS? <em style="background:#111;color:#ffcc00;padding:4px 14px 0;display:inline-block;margin-top:14px">OR 1 TEAM?</em>', 'خمسة مقاولين أم فريق واحد؟',
   `<div class="card" style="background:#111;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px">${['⚡ Electrical','🌐 Network','🎥 CCTV','🚪 Access','🏠 Gates','🔧 AMC'].map(t => `<div style="background:#1c1c1c;color:#fff;display:grid;place-items:center;font:800 40px Inter">${t}</div>`).join('')}</div>`, 'SITE'],
  ['reel-12-dashboard-from-zero', '--bg:#0d1117;--fg:#e6edf3;--accent:#3fb950;--font:\'Space Grotesk\';--size:116px;--tex:radial-gradient(800px 600px at 85% 15%,rgba(56,139,253,.2),transparent 60%)', W,
   '// web development', 'A dashboard <em>from zero</em> ⚡', 'لوحة تحكم من الصفر',
   `<div class="card" style="background:#161b22;border-color:#30363d;font:400 34px/1.7 'JetBrains Mono';padding:40px 44px;color:#e6edf3">
      <div><span style="color:#ff7b72">const</span> dashboard = <span style="color:#d2a8ff">build</span>({</div>
      <div>&nbsp;&nbsp;charts: <span style="color:#79c0ff">true</span>,</div><div>&nbsp;&nbsp;languages: [<span style="color:#a5d6ff">"en"</span>, <span style="color:#a5d6ff">"ar"</span>],</div>
      <div>&nbsp;&nbsp;speed: <span style="color:#a5d6ff">"8x"</span>,</div><div>});</div><div style="color:#3fb950;margin-top:20px">✓ live in production</div></div>`, 'DEV'],
  ['reel-13-tap-gate-opens', '--bg:#0a3a8c;--fg:#fff;--accent:#ffd23f;--accent-ink:#0a3a8c;--tex:linear-gradient(rgba(255,255,255,.12) 2px,transparent 2px) 0 0/120px 120px,linear-gradient(90deg,rgba(255,255,255,.12) 2px,transparent 2px) 0 0/120px 120px', W,
   'IoT · smart home', 'Tap → <em>gate opens</em> 📲', 'لمسة… والبوابة تُفتح',
   `<div class="card" style="background:rgba(255,255,255,.06);border-style:dashed;display:grid;place-items:center">
      <div style="display:flex;align-items:center;gap:50px;font:700 34px 'JetBrains Mono'">
        <div style="width:220px;height:400px;border:6px solid #fff;border-radius:40px;display:grid;place-items:center"><div style="background:#ffd23f;color:#0a3a8c;padding:22px 26px;border-radius:18px">OPEN</div></div>
        <div style="font-size:80px;color:#ffd23f">⟶</div>
        <div style="width:330px;height:300px;border:6px solid #fff;background:repeating-linear-gradient(90deg,#fff 0 10px,transparent 10px 50px);opacity:.9"></div></div></div>`, 'IOT'],
  ['reel-14-excel-vs-crm', '--bg:#f5f6fb;--fg:#111827;--accent:#4f46e5;--accent-ink:#fff;--font:Inter;--size:118px', N,
   'Custom CRM', 'Excel chaos <em>vs.</em> CRM calm', 'فوضى Excel مقابل هدوء CRM',
   `<div class="split"><div style="background:#fff;padding:30px;font:500 24px 'JetBrains Mono';color:#b91c1c;line-height:1.9">
      <span style="position:static;background:#b91c1c;color:#fff">😵 CHAOS</span><div style="margin-top:20px">A1: lead?? <br>B7: call back?<br>C3: #REF!<br>D9: ??? <br>💬 47 unread<br>📒 sticky note</div></div>
      <div style="background:#fff;padding:30px;font:700 26px Inter;color:#111827">
      <span style="position:static;background:#16a34a;color:#fff">😌 CALM</span>
      ${[['#94a3b8','New · 12'],['#38bdf8','Contacted · 8'],['#fb923c','Proposal · 5'],['#22c55e','Won · 4']].map(([c,t]) => `<div style="margin-top:22px;border-left:8px solid ${c};background:#f5f6fb;padding:18px 20px;border-radius:10px">${t}</div>`).join('')}</div></div>`, 'CRM'],
];

for (const [id, vars, logo, hook, title, ar, media, kw] of REELS) {
  const n = id.slice(5, 7);
  document.body.insertAdjacentHTML('beforeend', `
<section class="post" id="${id}" style="${vars}">
  <div class="brand"><img src="${logo}" alt="">ANQAH TECH<span class="no">REEL ${n}</span></div>
  <div class="body"><div class="hook">${hook}</div><h1>${title}</h1><div class="ar">${ar}</div></div>
  <div class="media">${media}<div class="play">▶</div></div>
  <div class="foot"><span>@anqahtech</span><span>Comment “${kw}”</span></div>
</section>`);
}
// Once fonts are loaded, put the media under the text block; shrink it if it would run into the footer (y=1680).
document.fonts.ready.then(() => document.querySelectorAll('.post').forEach(post => {
  const body = post.querySelector('.body'), media = post.querySelector('.media');
  const top = Math.max(1010, body.offsetTop + body.offsetHeight + 90);
  media.style.top = top + 'px';
  media.style.height = Math.min(640, 1660 - top) + 'px';
}));
</script>
</body>
</html>
