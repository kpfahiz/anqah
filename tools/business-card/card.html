<!DOCTYPE html>
<!-- Anqah Tech business card. Trim size 90 x 55 mm, with a 3 mm bleed on every side (page = 96 x 61 mm).
     Keep text 4 mm inside the trim (7 mm from the page edge). Page 1 = front, page 2 = back.
     Print-ready PDF + 300 dpi PNGs: node tools/business-card/render_card.mjs <path-to-node_modules-with-playwright-core> -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anqah Tech business card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
@page { size: 96mm 61mm; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #07080a; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.side { position: relative; width: 96mm; height: 61mm; overflow: hidden; page-break-after: always; break-after: page;
  background: radial-gradient(circle, #252b31 0.28mm, transparent 0.34mm) 0 0 / 3.2mm 3.2mm, #07080a; color: #e9edf0; font-family: 'IBM Plex Sans', sans-serif; }
.side:last-child { page-break-after: auto; break-after: auto; }
/* HUD corner brackets, 6 mm inside the page edge (3 mm inside the trim) */
.side::after { content: ''; position: absolute; inset: 6mm; --c: #b6ff3b; --l: 3.2mm; --w: 0.45mm; pointer-events: none;
  background:
    linear-gradient(var(--c),var(--c)) top left / var(--l) var(--w) no-repeat, linear-gradient(var(--c),var(--c)) top left / var(--w) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) top right / var(--l) var(--w) no-repeat, linear-gradient(var(--c),var(--c)) top right / var(--w) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) bottom left / var(--l) var(--w) no-repeat, linear-gradient(var(--c),var(--c)) bottom left / var(--w) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) bottom right / var(--l) var(--w) no-repeat, linear-gradient(var(--c),var(--c)) bottom right / var(--w) var(--l) no-repeat; }

/* ---------- front ---------- */
.front { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.front .glow { position: absolute; width: 60mm; height: 60mm; border-radius: 50%; left: 18mm; top: 0; background: radial-gradient(circle, rgba(182,255,59,0.14), transparent 65%); }
.front img { position: relative; width: 19mm; }
.front h1 { position: relative; font: 700 6.4mm/1 'Chakra Petch'; letter-spacing: 0.12em; margin-top: 2.4mm; }
.front .tag { position: relative; font: 700 2.15mm 'JetBrains Mono'; color: #b6ff3b; letter-spacing: 0.16em; margin-top: 2.2mm; }
.front .ar { position: relative; font: 600 2.4mm/1.6 'Noto Kufi Arabic'; direction: rtl; color: #aeb6be; margin-top: 0.8mm; }
.front .loc { position: absolute; left: 0; right: 0; bottom: 8.6mm; font: 500 1.75mm 'JetBrains Mono'; color: #7f8892; letter-spacing: 0.14em; }

/* ---------- back ---------- */
.back { padding: 8.2mm 8.2mm 8mm 9mm; display: flex; gap: 4mm; }
.contacts { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.55mm; }
.brand { display: flex; align-items: center; gap: 1.8mm; margin-bottom: 1.4mm; }
.brand img { width: 7mm; }
.brand b { font: 700 3.3mm 'Chakra Petch'; letter-spacing: 0.1em; }
.line { display: flex; align-items: center; gap: 2mm; font: 500 2.35mm/1 'IBM Plex Sans'; white-space: nowrap; }
.line svg { flex: none; width: 2.9mm; height: 2.9mm; stroke: #b6ff3b; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.line small { font: 500 1.7mm 'JetBrains Mono'; color: #7f8892; letter-spacing: 0.06em; margin-left: 0.6mm; }
.qrbox { flex: none; width: 24mm; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.qr { width: 21mm; height: 21mm; background: #fff; padding: 1.4mm; border-radius: 1mm; }
.qr svg { display: block; width: 100%; height: 100%; }
.qrbox p { font: 700 1.75mm 'JetBrains Mono'; color: #b6ff3b; letter-spacing: 0.12em; margin-top: 1.6mm; }
.qrbox .ar { font: 600 1.9mm/1.5 'Noto Kufi Arabic'; color: #aeb6be; direction: rtl; }
</style>
</head>
<body>

<section class="side front">
  <div class="glow"></div>
  <img src="../../images/logo-mark-white.png" alt="Anqah Tech logo">
  <h1>ANQAH TECH</h1>
  <div class="tag">POS · IoT · IT SOLUTIONS</div>
  <div class="ar">حلول نقاط البيع وإنترنت الأشياء وتقنية المعلومات</div>
  <div class="loc">UAE · SAUDI ARABIA · INDIA</div>
